name: Check

# A push to `main` builds, signs and publishes a release, so there is nowhere to find out
# whether something compiles without also shipping it. This runs on every other branch and
# does exactly that and nothing else — no APK, no release. Same shape as gi-os/LightChat's.
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      # Debug only: the release build is the thing that would produce a shippable APK, and
      # the point of this job is that it never does. Compiling debug catches everything a
      # type error or a broken resource reference can be caught by.
      - name: Compile
        run: ./gradlew :app:assembleDebug --stacktrace
