name: Build & Release APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write
  # light-common is resolved from GitHub Packages, which has no anonymous read.
  packages: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    environment: release
    runs-on: ubuntu-latest
    steps:
      - name: Restore release signing key and lineage
        id: signing
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          SIGNING_LINEAGE_BASE64: ${{ secrets.SIGNING_LINEAGE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for secret in RELEASE_KEYSTORE_BASE64 SIGNING_LINEAGE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ ! ${!secret} =~ [^[:space:]] ]]; then
              echo "::error::Missing required release signing secret: $secret"
              exit 1
            fi
          done

          umask 077
          signing_dir=$(mktemp -d "$RUNNER_TEMP/brightnotebook-signing.XXXXXX")
          decode() {
            if ! printf '%s' "${!1}" | base64 --decode > "$2" || [[ ! -s "$2" ]]; then
              echo "::error::$1 must contain non-empty base64"
              exit 1
            fi
          }
          decode RELEASE_KEYSTORE_BASE64 "$signing_dir/release.jks"
          decode SIGNING_LINEAGE_BASE64 "$signing_dir/release.lineage"
          printf 'keystore=%s\nlineage=%s\n' "$signing_dir/release.jks" "$signing_dir/release.lineage" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4

      # versionCode is the workflow run number, so every push produces a newer build
      # and `adb install -r` upgrades in place instead of erroring.
      - name: Stamp version
        id: ver
        run: |
          RUN=${{ github.run_number }}
          BASE=$(grep 'versionName' app/build.gradle.kts | head -1 | sed -E 's/.*"([0-9]+\.[0-9]+).*"/\1/')
          VERSION="${BASE}.${RUN}"
          sed -i -E "s/versionCode = .*/versionCode = ${RUN}/" app/build.gradle.kts
          sed -i -E "s/versionName = \".*\"/versionName = \"${VERSION}\"/" app/build.gradle.kts
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          grep -E 'versionCode|versionName' app/build.gradle.kts

      # The markdown and date logic is pure Kotlin precisely so it can be tested here.
      - name: Unit tests
        env:
          GPR_USER: ${{ secrets.GPR_USER }}
          GPR_TOKEN: ${{ secrets.GPR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      # The key shake-to-report files issues with. Scoped to issues:write on the private
      # gi-os/light-reports repo and nothing else, because it ends up inside a sideloaded
      # APK that anyone can unzip. A missing secret is not a build failure: the app queues
      # reports on the phone and sends them from a later build that has one.
      - name: Build APKs
        env:
          # Where shake-to-report posts: a URL, not a secret. Unset, reports queue on the phone.
          REPORT_RELAY_URL: ${{ vars.REPORT_RELAY_URL }}
          GPR_USER: ${{ secrets.GPR_USER }}
          GPR_TOKEN: ${{ secrets.GPR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Sign and verify release APK
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          KEYSTORE_FILE: ${{ steps.signing.outputs.keystore }}
          SIGNING_LINEAGE_FILE: ${{ steps.signing.outputs.lineage }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p out
          bash scripts/sign-release.sh app/build/outputs/apk/release/app-release-unsigned.apk \
            "out/LightNotebook-v$VERSION.apk" signing-lineage-root-fingerprint.txt signing-fingerprint.txt

      - name: Collect debug APK
        run: |
          V=${{ steps.ver.outputs.version }}
          mkdir -p debugout
          cp app/build/outputs/apk/debug/app-debug.apk "debugout/LightNotebook-v$V-debug.apk"
          ls -la out debugout

      # AGP shortens resource paths in release builds, so ic_launcher.png is renamed to
      # something like res/AB.png inside the zip. Ask the package what its icon is
      # instead of grepping filenames — the same lookup the launcher does.
      - name: Verify launcher icon is present
        run: |
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -1)
          "$AAPT2" dump badging out/*.apk > badging.txt
          grep -E "^(application:|application-icon-)" badging.txt
          grep -qE "^application:.*icon='[^']+'" badging.txt \
            || { echo '::error::package declares no launcher icon'; exit 1; }

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LightNotebook-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LightNotebook-debug-apk
          path: debugout/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: LightNotebook v${{ steps.ver.outputs.version }}
          files: out/LightNotebook-v${{ steps.ver.outputs.version }}.apk
          # RELEASE_NOTES.md holds this release and only this release — it is rewritten every
          # time, the way gi-os/LightCamera does it. The running index is the version table in
          # the README; the archive is the list of releases itself. A fix names the report it
          # closes, so a release says what was fixed and not only what changed.
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          make_latest: true

      # Tell the index a release exists instead of waiting for its cron. GitHub
      # schedules are best-effort -- observed 70 minutes apart against a 15
      # minute schedule -- so without this a new release can sit uncatalogued
      # for over an hour and simply not appear as an update.
      - name: Ping the index
        if: success()
        continue-on-error: true
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.INDEX_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/gi-os/brightmarket-index/dispatches \
            -d "{\"event_type\":\"app-released\"}" \
          || echo "index ping failed; the hourly cron will pick this up"
