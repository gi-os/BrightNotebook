<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LightNotebook · API Key QR</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #0b0b0c; color: #f2f2f2;
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px;
  }
  .card { width: 100%; max-width: 420px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  p.sub { margin: 0 0 20px; color: #9a9a9d; font-size: 14px; }
  label { display: block; font-size: 13px; color: #9a9a9d; margin-bottom: 6px; }
  input {
    width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid #2a2a2e;
    background: #151517; color: #f2f2f2; font-size: 15px; font-family: ui-monospace, monospace;
  }
  input:focus { outline: none; border-color: #6b6b70; }
  .qrwrap {
    margin-top: 24px; display: none; flex-direction: column; align-items: center; gap: 12px;
  }
  .qrwrap.show { display: flex; }
  .qrbox { background: #fff; padding: 16px; border-radius: 16px; }
  .hint { font-size: 12px; color: #7a7a7d; text-align: center; }
  .warn { margin-top: 16px; font-size: 12px; color: #c9a227; text-align: center; }
</style>
</head>
<body>
  <div class="card">
    <h1>LightNotebook API Key QR</h1>
    <p class="sub">Paste your Anthropic key. A QR appears below — scan it in Notebook → Settings → SCAN QR.</p>
    <label for="key">Anthropic API key</label>
    <input id="key" type="text" placeholder="sk-ant-api03-..." autocomplete="off" spellcheck="false" />
    <div id="qrwrap" class="qrwrap">
      <div id="qrbox" class="qrbox"></div>
      <div class="hint">Point the Light Phone at this code — Notebook scans it in-app.</div>
    </div>
    <div class="warn">Generated entirely in your browser. The key never leaves this page.</div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/davidshimjs-qrcodejs@0.0.2/qrcode.min.js"></script>
  <script>
    const input = document.getElementById('key');
    const wrap = document.getElementById('qrwrap');
    const box = document.getElementById('qrbox');
    let qr = null;
    function render() {
      if (typeof QRCode === 'undefined') { box.innerHTML = '<p style=\"color:#c33\">QR library failed to load — check your connection.</p>'; wrap.classList.add('show'); return; }
      const val = input.value.trim();
      box.innerHTML = '';
      if (!val) { wrap.classList.remove('show'); return; }
      qr = new QRCode(box, {
        text: val,
        width: 320,
        height: 320,
        correctLevel: QRCode.CorrectLevel.M
      });
      wrap.classList.add('show');
    }
    input.addEventListener('input', render);
  </script>
</body>
</html>
